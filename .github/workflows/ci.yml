# 📦 build
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-lint:
    name: shellcheck + bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: luizm/action-sh-checker@v0.9.0
        with:
          sh_checker_comment: true
          sh_checker_shfmt_disable: true

  smoke-test:
    name: smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: bash -n yaml-mode-switch.sh
      - name: Create sample config
        run: |
          cat > sample.yaml <<'EOF'
          features:
            test_mode: off
            debug: false
          server:
            max_jobs: 16
          EOF
      - name: Set boolean (on -> true)
        run: ./yaml-mode-switch.sh sample.yaml test_mode on
      - name: Assert normalized value
        run: |
          val="$(./yaml-mode-switch.sh sample.yaml test_mode --dump)"
          echo "val=[$val]"
          test "$val" = "true"
      - name: dry-run produces no file change
        run: |
          before="$(cat sample.yaml)"
          ./yaml-mode-switch.sh --dry-run sample.yaml test_mode off
          test "$(cat sample.yaml)" = "$before"
      - name: Set to off and verify
        run: |
          ./yaml-mode-switch.sh sample.yaml test_mode off
          test "$(./yaml-mode-switch.sh sample.yaml test_mode --dump)" = "false"