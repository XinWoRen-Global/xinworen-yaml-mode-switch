# 海内外多仓镜像同步
# Push 到 main 后，自动把代码同步到 Gitee / HF / Codeberg / GitCode，扩大宣传覆盖。
# 凭证通过仓库 Secrets 注入；未配置对应平台时对应步骤自动跳过，不影响主线。
#
# ⚠️ 踩过的三个坑（2026-09-03 修复，勿回退）：
#
#  1. secrets 必须在 **job 级 env** 声明。
#     step 级 `env` 在该 step 自己的 `if:` 求值时**不可见**，会导致
#     `if: env.XXX != ''` 恒为 false → 所有镜像步骤被静默跳过。
#
#  2. `continue-on-error: true` 会把失败**吞成绿灯**：step 的 outcome 在 UI 和
#     REST API 里都显示为 success，job 也 success。HF 镜像因此从 2026-08-27
#     起静默失败 6 天无人发现。
#     → 对策：保留 continue-on-error 做「平台间隔离」，但末尾加
#       `Report mirror results` 步骤聚合 outcome，任一真失败即 exit 1 让 job 变红。
#
#  3. Hugging Face 的 pre-receive 钩子**拒绝任何含二进制文件（PNG 等）的 git 推送**，
#     要求改用 Xet 存储。本仓库 assets/ 下有 3 个 PNG logo，直接 git push 必然被拒。
#     → 对策：HF 步骤改为推送「纯文本快照」（排除二进制，保留 SVG/代码/文档）。

name: mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    name: mirror to Gitee / HF / Codeberg / GitCode
    runs-on: ubuntu-latest
    env:
      GITEE_USER: ${{ secrets.GITEE_USER }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      HF_USER: ${{ secrets.HF_USER }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CODEBERG_USER: ${{ secrets.CODEBERG_USER }}
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      GITCODE_USER: ${{ secrets.GITCODE_USER }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Gitee（码云） ──
      - name: Mirror to Gitee
        id: gitee
        if: ${{ env.GITEE_TOKEN != '' }}
        continue-on-error: true
        run: |
          set -eo pipefail
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/xinworen-yaml-mode-switch.git"
          git push --force gitee main

      # ── Hugging Face（AI 社区曝光，免费） ──
      # 目标固定为组织 XinWoRen（数据集已于 2026-09-03 从个人账号 CuiwuYang 转移）。
      # 鉴权：HF git 只认 token，用户名位可为任意值；HF_USER 缺省时回退用 token 自身。
      # 内容：纯文本快照（HF 拒绝二进制入 git，见文件头注释 3）。
      - name: Mirror to Hugging Face
        id: hf
        if: ${{ env.HF_TOKEN != '' }}
        continue-on-error: true
        env:
          HF_AUTH_USER: ${{ secrets.HF_USER }}
        run: |
          set -eo pipefail
          SHA="$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          WORK="$(mktemp -d)"
          tar -C "$GITHUB_WORKSPACE" \
              --exclude='./.git' \
              --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' \
              --exclude='*.gif' --exclude='*.ico' --exclude='*.webp' \
              --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' \
              --exclude='*.pdf' --exclude='*.zip' --exclude='*.mp4' \
              -cf - . | tar -C "$WORK" -xf -
          cd "$WORK"
          git init -q
          git checkout -q -b main
          git add -A
          git -c user.name='xinworen-mirror-bot' -c user.email='contact@xinworen.com' \
              commit -q -m "mirror: XinWoRen-Global/xinworen-yaml-mode-switch@${SHA} (text-only snapshot)"
          HF_AUTH_USER="${HF_AUTH_USER:-${HF_TOKEN}}"
          git remote add hf "https://${HF_AUTH_USER}:${HF_TOKEN}@huggingface.co/datasets/XinWoRen/xinworen-yaml-mode-switch.git"
          git push --force hf main

      # ── Codeberg（欧盟/全球 OSS 社区，免费） ──
      # 仓库须已存在（Codeberg 新号自动建仓常被 403）。namespace = Codeberg 用户名。
      - name: Mirror to Codeberg
        id: codeberg
        if: ${{ env.CODEBERG_TOKEN != '' }}
        continue-on-error: true
        run: |
          set -eo pipefail
          git remote add codeberg "https://${CODEBERG_USER}:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_USER}/xinworen-yaml-mode-switch.git"
          git push --force codeberg main

      # ── GitCode / CSDN（中国大陆，全局镜像） ──
      # 仓库已通过 Gitee 兼容 API /api/v5 自动创建。namespace = GitCode 用户名句柄。
      - name: Mirror to GitCode
        id: gitcode
        if: ${{ env.GITCODE_TOKEN != '' }}
        continue-on-error: true
        run: |
          set -eo pipefail
          git remote add gitcode "https://${GITCODE_USER}:${GITCODE_TOKEN}@gitcode.com/${GITCODE_USER}/xinworen-yaml-mode-switch.git"
          git push --force gitcode main

      # ── 结果聚合：continue-on-error 会把失败吞成绿灯，这里强制把失败暴露为 job 失败 ──
      # skipped = 未配置该平台凭证，视为正常；只有真正的 failure 才让 job 变红。
      - name: Report mirror results
        if: always()
        run: |
          ok=""; bad=""; skipped=""
          check() {
            case "$2" in
              success) ok="$ok $1" ;;
              skipped) skipped="$skipped $1" ;;
              *)       bad="$bad $1($2)" ;;
            esac
          }
          check Gitee    "${{ steps.gitee.outcome }}"
          check HF       "${{ steps.hf.outcome }}"
          check Codeberg "${{ steps.codeberg.outcome }}"
          check GitCode  "${{ steps.gitcode.outcome }}"
          echo "✅ 成功:${ok:- 无}"
          echo "⏭️  跳过(未配凭证):${skipped:- 无}"
          echo "❌ 失败:${bad:- 无}"
          if [ -n "$bad" ]; then
            echo "::error::镜像推送失败:${bad}（continue-on-error 会吞掉失败，本步骤负责暴露）"
            exit 1
          fi
